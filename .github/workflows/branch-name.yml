name: branch-name

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate head branch name
    runs-on: ubuntu-latest
    steps:
      - name: check branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          branch="$HEAD_REF"
          echo "head branch: $branch"
          case "$branch" in
            dependabot/*|gh-readonly-queue/*)
              echo "allowed automated branch"
              exit 0
              ;;
          esac
          pattern='^(main|(feat|fix|docs|refactor|perf|test|chore|build|ci)/(issue-[0-9]+-)?[a-z0-9]+([.-][a-z0-9]+)*|release/v[0-9]+(\.[0-9]+){0,3})$'
          if printf '%s' "$branch" | grep -Eq "$pattern"; then
            echo "valid branch name"
          else
            echo "invalid branch name: $branch" >&2
            echo "expected: <type>/[issue-<N>-]<slug>, release/v<semver>, or an allowed automated branch" >&2
            exit 1
          fi
