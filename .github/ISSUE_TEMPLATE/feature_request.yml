name: 功能建议
description: 提议新的公共能力或兼容性改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述真实使用场景，而不只是期望的 API 形状。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、兼容性要求和替代方案。
    validations:
      required: true
  - type: dropdown
    id: breaking
    attributes:
      label: 是否可能破坏兼容性
      options:
        - 否
        - 是
        - 不确定
    validations:
      required: true
