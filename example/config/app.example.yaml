# =============================================================================
# 应用侧可观测配置结构示意（非库内置加载器）
# 用途：给接入方 YAML/配置中心对照字段；自行用 viper/koanf/envconfig 解析后
#       填入 telemetry.Config 与 log.NewLogger 选项。
# =============================================================================

observability:
  # --- 服务身份（OTel Resource）---
  service:
    # name: OTel service.name，Grafana/Tempo 筛选主键；必填，稳定短名
    name: order-api
    # version: service.version，区分发布版本
    version: "0.1.0"
    # environment: deployment.environment（dev/staging/prod）
    environment: dev
    # region: 低基数自定义标签，可空
    region: ""
    # instance: 低基数实例标识，可空
    instance: ""

  # --- OTLP 出口 ---
  otlp:
    # disabled: 对应 OTEL_SDK_DISABLED；true = 全离线 noop Providers
    disabled: false
    # endpoint: telemetry.Config 的 Provider OTLP 地址，支持 host:port 或 URL
    # 注意: 显式 endpoint 或 SetupFromEnvironment 启动时读到环境变量，都会固化为 OTLP 出口
    endpoint: "127.0.0.1:4317"
    # jsonl_path: endpoint 为空或 disabled 时的日志落盘路径
    jsonl_path: "logs/events.jsonl"

  # --- 采样与导出频率（库默认见 telemetry）---
  sampling:
    # trace_ratio: 头部采样率 (0,1]；演示 0.1，生产按 QPS 调
    trace_ratio: 0.1
  export:
    # trace_batch_timeout: BatchSpanProcessor 导出间隔
    trace_batch_timeout: 5s
    # metric_interval: PeriodicReader 周期
    metric_interval: 15s
    # log_batch_timeout: BatchLogRecordProcessor 间隔
    log_batch_timeout: 1s

  # --- 日志治理（NewLogger 选项，默认不自动挂载）---
  log:
    sampler:
      # type: none | result_keep
      type: result_keep
      # ratio: 非高价值 app.result 的保留概率；1=全量
      # 高价值 failed/error/blocked/denied 始终保留（ResultKeepSampler）
      ratio: 1.0
    masker:
      # enabled: 是否 WithMasker(FieldMasker)
      enabled: true
      # extra_keys: 追加敏感键（完整属性名，如 app.phone）
      # 默认已含 password/token/authorization 等，见 log.DefaultSensitiveKeys()
      extra_keys: []
      # redact: 替换文本
      redact: "***"

  # --- 中间件（官方提供 Gin 集成）---
  middleware:
    # ginlog: access 事件；需配合 otelgin 才能自动填 trace_id/span_id
    ginlog: true
    # recover: panic → error.runtime.panic + 500
    recover: true
