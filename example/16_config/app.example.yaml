# =============================================================================
# 应用侧可观测配置结构示意（非库内置加载器）
#
# 本文件只用于展示「应用自己的配置中心 / YAML 文件」应保留哪些字段；
# 库不会读取 YAML，接入方需自行用 viper / koanf / envconfig 等解析后，
# 再映射到：
#   - telemetry.Config
#   - telemetry.ResourceConfig / TraceConfig / MetricConfig / LogConfig
#   - log.NewLogger 选项
#   - middleware 各 Config
# =============================================================================

observability:
  # --- 顶层开关与 OTLP 地址，映射到 telemetry.Config ---
  enabled: true
  # endpoint 只在 trace.output / metric.output / log.output 中某个值为 otlp 时才解析；
  # file / stdout / none / local 组合不受该地址影响。
  endpoint: "127.0.0.1:4317"

  # --- 服务身份，映射到 telemetry.ResourceConfig ---
  resource:
    service_name: order-api
    service_version: "0.1.0"
    environment: development
    region: ""
    instance: ""

  # --- Trace，映射到 telemetry.TraceConfig ---
  trace:
    # output: otlp | file | stdout | none | local
    # local 仅 Trace 可用：只生成合法 TraceID/SpanID，不导出完整 Span。
    output: otlp
    # file_path 仅在 output=file 时填写
    file_path: ""
    sample_ratio: 0.1
    batch_timeout: 5s
    # 自定义 sdktrace.SpanExporter 只能由代码注入，不放 YAML

  # --- Metric，映射到 telemetry.MetricConfig ---
  metric:
    # output: otlp | file | stdout | none
    output: otlp
    # file_path 仅在 output=file 时填写
    file_path: ""
    export_interval: 15s
    # 自定义 sdkmetric.Reader 只能由代码注入，不放 YAML

  # --- Log，映射到 telemetry.LogConfig ---
  log:
    # output: otlp | file | stdout | none
    output: otlp
    # file_path 仅在 output=file 时填写
    file_path: logs/events.jsonl
    batch_timeout: 1s
    queue_size: 2048

    # rotation 是应用层字段，解析后应转为 file.WithRotation；
    # 它最终进入 LogConfig.FileOptions，不是 LogConfig 的独立 YAML 字段。
    rotation:
      max_size_mb: 100
      max_backups: 10
      max_age_days: 30
      compress: true
      local_time: true

  # --- Logger 治理选项，映射到 log.NewLogger options ---
  log_options:
    sampler:
      # type: none | result_keep | event_keep
      # none（推荐默认）：全量保留，确保 HTTP 语义事件都有对应 AccessEvent
      type: none
      # event_keep 高流量可选：business/error/security/audit/probe 全量，
      # access 成功按比例保留。仅在已有网关全量 access 或接受关联不完整时启用。
      # keep_types: [business, error, security, audit, probe]
      # fallback_ratio: 0.1
      # result_keep 只按 app.result 采样，不区分事件类型
      # type: result_keep
      # ratio: 1.0
    masker:
      enabled: true
      # extra_keys 追加敏感键；内置已覆盖 password/token/authorization 等
      extra_keys: []
      redact: "***"

  # --- Gin 中间件开关，映射到 middleware/gin 的 Trace/AccessLog/Recover/Metrics/ErrorResponse ---
  middleware:
    gin:
      trace: true
      access_log: true
      recover: true
      metrics: true
      error_response: true
