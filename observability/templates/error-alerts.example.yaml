# =============================================================================
# Error 告警规则模板（Prometheus / Mimir ruler 风格）— 字段注释版
# 按 error.type（OTel/gRPC 标准枚举）聚合；业务预期拒绝码不进系统告警
# 下列 metric 名为示意，须换成接入方真实导出名称
# =============================================================================

groups:
  # name: 规则组名（ruler 内唯一）
  # interval: 评估周期
  - name: go-observability-errors
    interval: 1m
    rules:
      # alert: 告警名称（通知里显示）
      # expr: PromQL；>0 即出现 INTERNAL（含 panic）类日志/指标
      # for: 持续多久才 firing；0m = 立即
      # labels.severity: 路由用
      # annotations: 摘要与排障提示（可带 trace 链接模板）
      - alert: InternalError
        expr: sum(rate(log_events_total{error_type="INTERNAL"}[5m])) > 0
        for: 0m
        labels:
          severity: P0
        annotations:
          summary: "internal error detected"
          description: "error.type=INTERNAL（含 panic）；带 trace_id 跳转排障。"

      - alert: InfraErrorRateHigh
        # 基础设施错误率 > 1% 持续 5m（阈值自定）
        expr: |
          sum(rate(log_events_total{error_type=~"UNAVAILABLE|DEADLINE_EXCEEDED|INTERNAL"}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_total[5m])), 1) > 0.01
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "infra error rate > 1% (5m)"

      - alert: UpstreamHTTPErrors
        expr: |
          sum(rate(log_events_total{error_type="UNAVAILABLE"}[5m])) by (error_type)
          > 0.02
        for: 5m
        labels:
          severity: P2
        annotations:
          summary: "upstream HTTP errors elevated"

# 明确不告警（只看板 / 业务 SLO）：
#   error.type = INVALID_ARGUMENT | FAILED_PRECONDITION | ALREADY_EXISTS | NOT_FOUND |
#     PERMISSION_DENIED | UNAUTHENTICATED | OUT_OF_RANGE | RESOURCE_EXHAUSTED
