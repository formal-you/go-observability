# =============================================================================
# Trace 管线模板（使用者自有）— 字段注释版
# 应用侧：telemetry 头部采样 + otelgin/otelhttp
# =============================================================================

receivers:
  otlp:
    protocols:
      # grpc: span 入口，默认 4317
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # batch: App BSP 之后的二次批量
  batch:
    timeout: 1s
    send_batch_size: 512

  # tail_sampling（可选）：启用前先将应用 TraceSampleRatio 设为 1.0 完整导出；
  # Collector 只能从已收到的 trace 中按错误、延迟或概率做保留决策。
  # decision_wait: 等 trace 凑齐的时间窗口
  # num_traces: 内存中未决 trace 上限
  # policies[].type: status_code | probabilistic | ...
  # tail_sampling:
  #   decision_wait: 10s
  #   num_traces: 50000
  #   policies:
  #     - name: errors-legal
  #       type: status_code
  #       status_code: { status_codes: [ERROR] }
  #     - name: probabilistic-rest
  #       type: probabilistic
  #       probabilistic: { sampling_percentage: 10 }

exporters:
  # otlp/tempo.endpoint: Tempo 接收 OTLP gRPC 的地址
  # tls.insecure: 本地 true；生产 false + 证书
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      # processors: [tail_sampling, batch]
      exporters: [otlp/tempo]

# 应用侧 telemetry.Config 对应关系：
#   TraceSampleRatio   默认 0.1   — 头部采样；启用 tail_sampling 前设为 1.0
#   TraceBatchTimeout  默认 5s    — BatchSpanProcessor
#   ParentBased + TraceIDRatioBased
