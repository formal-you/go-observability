# =============================================================================
# OTel Collector（contrib）— 本仓库 LGTM 参考栈使用的配置（字段注释）
# 启动：docker compose -f observability/docker-compose.yml up -d
# 应用：OTEL_EXPORTER_OTLP_ENDPOINT=127.0.0.1:4317
# 更完整的「复制到生产」注释版见 example/config/collector.example.yaml
# =============================================================================
#
# 数据流：
#   traces  -> Tempo（otlp gRPC）
#   logs    -> Loki（otlp HTTP /otlp）
#   metrics -> Mimir（prometheusremotewrite；A1：Prometheus 仅兼容面）

receivers:
  # otlp: 唯一默认接收器；应用 writer/otlp + telemetry 三 exporter 打到此
  otlp:
    protocols:
      # grpc.endpoint: 0.0.0.0 表示容器内全接口；compose 映射 127.0.0.1:4317
      grpc:
        endpoint: 0.0.0.0:4317
      # http.endpoint: OTLP/HTTP，映射 4318
      http:
        endpoint: 0.0.0.0:4318
  # 可选：零代码 docker 日志（filelog）。本组件默认 OTLP 直推，此块仅供参考。
  # filelog:
  #   include: ["/var/lib/docker/containers/*/*-json.log"]
  #   start_at: beginning
  #   operators:
  #     - type: json_parser
  #       parse_from: body
  #       timestamp:
  #         parse_from: attributes.time
  #         layout_type: gotime
  #         layout: "2006-01-02T15:04:05.999999999Z07:00"
  #       severity:
  #         parse_from: attributes.stream
  #         preset: none
  #         mapping:
  #           info: [stdout, stderr]
  #   resource:
  #     service.name: go-observability-demo

processors:
  # batch.timeout: 等待凑批最长时间
  # batch.send_batch_size: 单批最大条数
  batch:
    timeout: 1s
    send_batch_size: 256

exporters:
  # otlp_grpc/tempo.endpoint: compose 服务名 tempo，容器网络内 4317
  # tls.insecure: 本地无 TLS
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # otlp_http/loki.endpoint: Loki 3 OTLP，必须带 /otlp
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  # prometheusremotewrite/mimir.endpoint: Mimir 推送 API
  # resource_to_telemetry_conversion: resource 属性 → metric 标签
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    # traces / metrics / logs：三信号分管线，processors 仅 batch（可加 tail_sampling）
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite/mimir]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
